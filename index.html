<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1018" />
    <title>Ночной  гул волн</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="player-app">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="Ночной плеер, в начало">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>Nightwave</span>
        </a>
        <p class="topbar-status"><span class="status-dot"></span> Локальная медиатека</p>
      </header>

      <section class="player-layout" id="top">
        <section class="now-playing" aria-labelledby="now-playing-title">
          <div class="cover-wrap">
            <img
              class="cover-image"
              id="cover-image"
              src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=85"
              alt="Обложка текущего трека"
              width="900"
              height="900"
              decoding="async"
              fetchpriority="high"
            />
            <span class="cover-glow" aria-hidden="true"></span>
          </div>

          <div class="track-meta">
            <p class="eyebrow" id="now-playing-title">Сейчас играет</p>
            <h1 id="track-title">Выбери трек</h1>
            <p class="artist-name" id="track-artist">Твоя локальная коллекция</p>
          </div>

          <div class="timeline" aria-label="Прогресс трека">
            <input
              class="range-input progress-input"
              id="progress-bar"
              type="range"
              min="0"
              max="100"
              value="0"
              aria-label="Перемотать трек"
            />
            <div class="time-row">
              <time id="current-time">0:00</time>
              <time id="duration">0:00</time>
            </div>
          </div>

          <div class="controls" aria-label="Управление плеером">
            <button class="icon-button" id="shuffle-button" type="button" title="Перемешать" aria-label="Перемешать">
              &#8646;
            </button>
            <button class="icon-button control-skip" id="previous-button" type="button" title="Предыдущий трек" aria-label="Предыдущий трек">
              &#9198;
            </button>
            <button class="play-button" id="play-button" type="button" title="Воспроизвести" aria-label="Воспроизвести">
              &#9654;
            </button>
            <button class="icon-button control-skip" id="next-button" type="button" title="Следующий трек" aria-label="Следующий трек">
              &#9197;
            </button>
            <button class="icon-button" id="repeat-button" type="button" title="Повторять трек" aria-label="Повторять трек">
              &#10227;
            </button>
          </div>

          <div class="volume-row">
            <span class="volume-icon" aria-hidden="true">&#9834;</span>
            <input
              class="range-input volume-input"
              id="volume-bar"
              type="range"
              min="0"
              max="100"
              value="75"
              aria-label="Громкость"
            />
            <output id="volume-value" for="volume-bar">75%</output>
          </div>
        </section>

        <aside class="playlist-panel" aria-labelledby="playlist-title">
          <div class="playlist-header">
            <div>
              <p class="eyebrow">Очередь</p>
              <h2 id="playlist-title">Мои треки</h2>
            </div>
            <span class="track-count" id="track-count">0 треков</span>
          </div>

          <ul class="playlist" id="playlist" aria-live="polite">
            <li class="playlist-empty" id="playlist-empty">
              <span class="empty-note" aria-hidden="true">&#9834;</span>
              <p>Добавь массив треков в JavaScript, и они появятся здесь.</p>
            </li>
          </ul>
        </aside>
      </section>
    </main>

    <audio id="audio-player" preload="metadata"></audio>
  </body>
</html>
